{% extends "base.html" %}
{% block title %}能力画像 · FreelancerAuto{% endblock %}
{% block page_title %}Freelancer 能力画像{% endblock %}
{% block content %}
<section class="settings-intro"><h2>AI 生成投标函的事实依据</h2><p>分析器不会声称你具备这里未填写的技能或经验。</p></section>
<form method="post" action="/settings/profile" class="settings-form">
  <div class="settings-group"><h3>能力</h3><label class="field"><span>技能（每行一项）</span><textarea name="skills" rows="12">{{ profile.skills|join('\n') }}</textarea></label></div>
  <div class="settings-group"><h3>偏好</h3><div class="form-grid"><label class="field"><span>偏好的项目</span><textarea name="preferred_projects" rows="8">{{ profile.preferences.get('preferred_projects', [])|join('\n') }}</textarea></label><label class="field"><span>希望避开的项目</span><textarea name="avoid_projects" rows="8">{{ profile.preferences.get('avoid_projects', [])|join('\n') }}</textarea></label></div></div>
  <div class="settings-group"><h3>报价与可用时间</h3><div class="form-grid form-grid-4">
    <label class="field"><span>目标时薪（美元）</span><input type="number" min="0" step="0.01" name="target_hourly_rate_usd" value="{{ profile.pricing.get('target_hourly_rate_usd', 20) }}" required></label>
    <label class="field"><span>最低有效时薪（美元）</span><input type="number" min="0" step="0.01" name="minimum_effective_hourly_rate_usd" value="{{ profile.pricing.get('minimum_effective_hourly_rate_usd', 10) }}" required></label>
    <label class="field"><span>同时进行的项目上限</span><input type="number" min="1" name="max_active_projects" value="{{ profile.availability.get('max_active_projects', 2) }}" required></label>
    <label class="field"><span>每周可用小时数</span><input type="number" min="1" name="available_hours_per_week" value="{{ profile.availability.get('available_hours_per_week', 20) }}" required></label>
  </div></div>
  <div class="form-actions"><button class="button button-primary"><i data-lucide="save"></i>保存能力画像</button></div>
</form>
{% endblock %}
